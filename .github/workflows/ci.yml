# Covenant CI — runs on the PUBLIC mirror (lucheeseng827/covenant).
#
# Synced from the source repo as .github/workflows/ci.yml. Edit it at
# ops/ci.yml in the source tree, not here on the mirror: the next sync
# overwrites the mirror copy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: cargo test
        run: cargo test --all-features --locked

  # The console is embedded with rust_embed from frontend/dist, which is
  # committed. Prove the default build stays lean and the serve build still
  # finds its assets — a missing dist only fails when the feature is on.
  serve-feature:
    name: serve feature builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo build --locked
      - run: cargo build --features serve --locked

  # The quickstart in the README is the first thing anyone runs. If it drifts,
  # the project's credibility goes with it, so CI runs it.
  quickstart:
    name: README quickstart runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: build
        run: cargo build --release --locked

      - name: scaffold, lint, and enforce
        run: |
          set -euo pipefail
          B=./target/release/covenant
          work=$(mktemp -d)

          # init -> validate: the starter contract must lint clean.
          (cd "$work" && "$OLDPWD/$B" init covenant.yaml && "$OLDPWD/$B" validate covenant.yaml)

          # The bundled demo contract lints clean and passes its clean data.
          "$B" validate examples/contracts/orders.yaml
          "$B" check examples/data/orders.ndjson -c examples/contracts/orders.yaml

          # ...and fails the dirty data with exit 1, not 0 and not 2.
          set +e
          "$B" check examples/data/orders_bad.ndjson -c examples/contracts/orders.yaml
          code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::expected exit 1 on violating data, got $code"; exit 1; }

          # diff blocks the breaking revision.
          set +e
          "$B" diff examples/contracts/orders.yaml examples/contracts/orders_v2.yaml --fail-on breaking
          code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::expected exit 1 on a breaking diff, got $code"; exit 1; }

          # infer round-trips: the draft lints, and accepts the data it came from.
          "$B" infer examples/data/orders.ndjson --out "$work/drafted.yaml"
          "$B" validate "$work/drafted.yaml"
          "$B" check examples/data/orders.ndjson -c "$work/drafted.yaml"

          echo "Quickstart OK."
