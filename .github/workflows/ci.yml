# Covenant CI — runs on the PUBLIC mirror (lucheeseng827/covenant).
#
# Synced from the source repo as .github/workflows/ci.yml. Edit it at
# ops/ci.yml in the source tree, not here on the mirror: the next sync
# overwrites the mirror copy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: cargo test
        run: cargo test --all-features --locked

      # The row engine alone: what the stream-processor plugins link.
      - name: without the arrow feature
        run: |
          cargo clippy --all-targets --no-default-features --locked
          cargo test --no-default-features --locked

  # The console is embedded with rust_embed from frontend/dist, which is
  # committed. Prove the default build stays lean and the serve build still
  # finds its assets — a missing dist only fails when the feature is on.
  serve-feature:
    name: serve feature builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo build --locked
      - run: cargo build --features serve --locked

  # Cargo.toml's rust-version is a promise; this job keeps it. The toolchain is
  # read from Cargo.toml, so bumping the declared MSRV is a one-line change and
  # the check can never test a different version than the one declared. It runs
  # `check`, not the tests: the promise is that the crate builds, and
  # dev-dependencies may need a newer compiler than the crate itself does.
  msrv:
    name: MSRV (rust-version) builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$v" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check --locked
      - run: cargo check --locked --features serve

  # `covenant export postgres` claims a table that rejects exactly the rows
  # `covenant check` reports. This job holds it to that against a real
  # Postgres: the ODCS conformance vectors, edge values the engines decide,
  # and every translated pattern (tests/postgres_test.rs). It uses the
  # PostgreSQL the runner image ships, so no image is pulled.
  postgres:
    name: Postgres dialect verified
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: start PostgreSQL
        run: |
          set -euo pipefail
          # ubuntu-24.04 ships PostgreSQL 16 with its service stopped.
          command -v pg_ctlcluster >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql; }
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          # The exported tables need UTF8: lengths and patterns count characters.
          createdb --encoding UTF8 --template template0 --locale C.UTF-8 covenant

      - name: verify the dialect
        env:
          COVENANT_TEST_POSTGRES: postgresql:///covenant?host=/var/run/postgresql
        run: cargo test --locked --test postgres_test -- --include-ignored

  # `covenant gate --brokers` (the kafka feature) against a real broker:
  # records forwarded as they arrived, dead letters with their source,
  # tombstones, a key in the partition a Java producer picks, nothing
  # committed past a refused delivery, a clean stop on SIGTERM, and a
  # rebalance between two gates that loses and repeats nothing
  # (tests/kafka_test.rs).
  kafka:
    name: Kafka gate verified
    runs-on: ubuntu-24.04
    services:
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: build (librdkafka from source)
        run: cargo build --locked --features kafka --tests
      - name: wait for the broker
        run: |
          for _ in $(seq 60); do
            (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && exit 0
            sleep 1
          done
          echo "::error::the broker never listened on 9092"; exit 1
      - name: verify the Kafka gate
        env:
          COVENANT_TEST_KAFKA: 127.0.0.1:9092
        run: cargo test --locked --features kafka --test kafka_test -- --include-ignored

  # `check --openlineage` in a running catalog: Marquez, the OpenLineage
  # reference implementation, keeps the run and shows each rule's result on
  # the dataset, and a later run's verdict in place of an earlier one
  # (tests/marquez_test.rs). Marquez migrates its database as it starts, so it
  # starts once its Postgres takes connections over TCP (the image's first
  # boot serves its socket only, then restarts).
  marquez:
    name: OpenLineage events land in Marquez
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo build --locked --tests
      - name: start Marquez and its Postgres
        run: |
          set -euo pipefail
          docker network create marquez
          docker run -d --name marquez-db --network marquez -e POSTGRES_USER=marquez \
            -e POSTGRES_PASSWORD=marquez -e POSTGRES_DB=marquez postgres:14
          for _ in $(seq 60); do
            docker exec marquez-db pg_isready -h 127.0.0.1 -U marquez >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name marquez --network marquez -p 5000:5000 -p 5001:5001 \
            -e POSTGRES_HOST=marquez-db -e SEARCH_ENABLED=false -e MARQUEZ_CONFIG=marquez.dev.yml \
            marquezproject/marquez:0.51.1
          for _ in $(seq 90); do
            curl -sf http://localhost:5001/healthcheck >/dev/null && exit 0
            sleep 2
          done
          docker logs marquez 2>&1 | tail -50
          echo "::error::Marquez never became healthy"; exit 1
      - name: verify against Marquez
        env:
          COVENANT_TEST_MARQUEZ: http://localhost:5000
        run: cargo test --locked --test marquez_test -- --ignored

  # The gate inside Redpanda: the Data Transform module, built for
  # wasm32-wasip1, deployed into a real broker and held to `covenant gate` on
  # the same records (integrations/redpanda-transform/e2e.py). rpk is the
  # broker's own, run in its container, which sees the checkout at the same
  # path so `--file` resolves.
  redpanda-transform:
    name: Redpanda transform verified
    runs-on: ubuntu-24.04
    env:
      COVENANT_CONTRACT: ../../examples/contracts/orders.yaml
      COVENANT_NO_UNIQUE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: |
            .
            integrations/redpanda-transform

      - name: start Redpanda with data transforms
        run: |
          set -euo pipefail
          docker run -d --name redpanda -p 9092:9092 -p 9644:9644 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            redpandadata/redpanda:v26.2.3 redpanda start --mode dev-container --smp 1 \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:9092
          healthy() {
            for _ in $(seq 90); do
              docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && return 0
              sleep 1
            done
            docker logs redpanda | tail -50; return 1
          }
          healthy
          # Enabling transforms takes a restart.
          docker exec redpanda rpk cluster config set data_transforms_enabled true
          docker restart redpanda
          healthy

      - name: the judgement, on the host
        working-directory: integrations/redpanda-transform
        run: cargo test --target x86_64-unknown-linux-gnu
      - name: build the module (the target is wasm32-wasip1 here)
        working-directory: integrations/redpanda-transform
        run: cargo build --release
      - run: cargo build --locked --bin covenant
      - name: deployed into Redpanda, held to covenant gate
        working-directory: integrations/redpanda-transform
        env:
          RPK: docker exec -i redpanda rpk
        run: |
          python3 e2e.py "$GITHUB_WORKSPACE/target/debug/covenant" \
            "$PWD/target/wasm32-wasip1/release/covenant-gate.wasm" \
            ../../examples/contracts/orders.yaml

  # The gate on the JVM: the engine's WebAssembly build run on Chicory, held
  # to the native binary on the demo orders (mvn verify -Dcovenant.bin); the
  # Kafka Connect transformation in a real Connect worker whose sink and dead
  # letter queue must match `covenant gate`; and the Kroxylicious filter in a
  # real proxy, refusing at produce time exactly what the gate blocks
  # (integrations/jvm).
  jvm:
    name: JVM gate, Kafka Connect and Kroxylicious verified
    runs-on: ubuntu-24.04
    services:
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
    env:
      KAFKA_VERSION: 4.1.0
      KROXYLICIOUS_VERSION: 0.23.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: |
            .
            integrations/jvm/embed
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: integrations/jvm/**/pom.xml
      - run: cargo build --locked --bin covenant

      - name: build and test (the gate held to the native binary)
        working-directory: integrations/jvm
        run: mvn -B verify -Dcovenant.bin="$GITHUB_WORKSPACE/target/debug/covenant"

      - name: a Kafka distribution, for its Connect worker and tools
        id: kafka-dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kafka
          key: kafka-2.13-${{ env.KAFKA_VERSION }}
      - if: steps.kafka-dist.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tgz="kafka_2.13-$KAFKA_VERSION.tgz"
          curl -sSfLO "https://archive.apache.org/dist/kafka/$KAFKA_VERSION/$tgz"
          want=$(curl -sSfL "https://archive.apache.org/dist/kafka/$KAFKA_VERSION/$tgz.sha512" | tr -d ' \n' | sed 's/.*://' | tr 'A-F' 'a-f')
          [ "$(sha512sum "$tgz" | cut -d' ' -f1)" = "$want" ] || { echo "::error::$tgz checksum mismatch"; exit 1; }
          mkdir -p ~/kafka && tar xzf "$tgz" -C ~/kafka --strip-components 1

      - name: in a real Connect worker, held to covenant gate
        env:
          KAFKA_BOOTSTRAP: 127.0.0.1:9092
        run: |
          set -euo pipefail
          for _ in $(seq 60); do
            (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && break
            sleep 1
          done
          KAFKA_HOME=~/kafka python3 integrations/jvm/e2e_connect.py target/debug/covenant \
            integrations/jvm/covenant-connect/target/covenant-connect-0.1.0-SNAPSHOT.jar \
            examples/contracts/orders.yaml

      - name: a Kroxylicious distribution
        id: kroxylicious-dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kroxylicious
          key: kroxylicious-${{ env.KROXYLICIOUS_VERSION }}
      - if: steps.kroxylicious-dist.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/io/kroxylicious/kroxylicious-app/$KROXYLICIOUS_VERSION"
          tgz="kroxylicious-app-$KROXYLICIOUS_VERSION-bin.tar.gz"
          curl -sSfLO "$base/$tgz"
          [ "$(sha512sum "$tgz" | cut -d' ' -f1)" = "$(curl -sSfL "$base/$tgz.sha512" | cut -c1-128)" ] \
            || { echo "::error::$tgz checksum mismatch"; exit 1; }
          mkdir -p ~/kroxylicious && tar xzf "$tgz" -C ~/kroxylicious --strip-components 1

      - name: in a Kroxylicious proxy, held to covenant gate
        env:
          KAFKA_BOOTSTRAP: 127.0.0.1:9092
        run: |
          KAFKA_HOME=~/kafka KROXYLICIOUS_HOME=~/kroxylicious python3 integrations/jvm/e2e_kroxylicious.py \
            target/debug/covenant \
            integrations/jvm/covenant-kroxylicious/target/covenant-kroxylicious-0.1.0-SNAPSHOT.jar \
            examples/contracts/orders.yaml

  # The UDFs in Arroyo SQL: rendered with the demo contract, registered in a
  # real Arroyo cluster (the release binary, pinned by checksum) whose own
  # compiler builds them against the published UDF plugin, and run in a SQL
  # pipeline whose output must match `covenant gate`
  # (integrations/arroyo/e2e_arroyo.py).
  arroyo:
    name: Arroyo UDFs verified
    runs-on: ubuntu-24.04
    env:
      ARROYO_VERSION: 0.15.0
      ARROYO_SHA256: 8aba5032e2d1ce6c8af1ba4fa9c0050912a78fe98280f73e20f68e391171f048
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Arroyo
        id: arroyo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/arroyo
          key: arroyo-${{ env.ARROYO_VERSION }}
      - if: steps.arroyo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL -o arroyo.tgz \
            "https://github.com/ArroyoSystems/arroyo/releases/download/v$ARROYO_VERSION/arroyo-linux-x86_64.tar.gz"
          echo "$ARROYO_SHA256  arroyo.tgz" | sha256sum -c -
          mkdir -p ~/arroyo && tar xzf arroyo.tgz -C ~/arroyo --strip-components 1
      - run: cargo build --locked --bin covenant
      - name: the UDFs, compiled by Arroyo and run in a pipeline
        run: python3 integrations/arroyo/e2e_arroyo.py target/debug/covenant ~/arroyo/arroyo

  # The Python face: one abi3 wheel, tested on the oldest and the newest CPython
  # it claims, against the command it ships beside. The Arrow tests run where
  # pyarrow and polars install (3.13) and skip on 3.9.
  python:
    name: Python wheel (abi3, 3.9 + 3.13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
            3.9
            3.13

      - name: build the abi3 wheel
        working-directory: python
        run: |
          set -euo pipefail
          python3.13 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install "maturin>=1.5,<2"
          "$RUNNER_TEMP/build/bin/maturin" build --release

      - name: the wheel on 3.9 and 3.13
        working-directory: python
        run: |
          set -euo pipefail
          for py in python3.9 python3.13; do
            "$py" -m venv "$RUNNER_TEMP/$py"
            "$RUNNER_TEMP/$py/bin/pip" install target/wheels/covenant_data-*-abi3-*.whl
            if [ "$py" = python3.13 ]; then
              "$RUNNER_TEMP/$py/bin/pip" install pyarrow polars
            fi
            (cd tests && "$RUNNER_TEMP/$py/bin/python" -m unittest -v test_covenant_data)
          done

  # The WASM face: the same command built for wasm32-wasip1 and run under
  # Node's WASI, held byte for byte to the native build — the examples, a CSV,
  # the stream gate, diff, export, the conformance vectors and a profile file.
  wasm:
    name: WASM (wasm32-wasip1) matches native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: cargo build --locked --bin covenant
      - run: cargo build --locked --bin covenant --target wasm32-wasip1
      - run: bash .github/scripts/wasm-golden.sh target/debug/covenant target/wasm32-wasip1/debug/covenant.wasm
      # The JS API over the same build, its files held in memory (js/covenant.mjs).
      - run: node js/golden.mjs target/debug/covenant target/wasm32-wasip1/debug/covenant.wasm

  # The quickstart in the README is the first thing anyone runs. If it drifts,
  # the project's credibility goes with it, so CI runs it.
  quickstart:
    name: README quickstart runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: build
        run: cargo build --release --locked

      - name: scaffold, lint, and enforce
        run: |
          set -euo pipefail
          B=./target/release/covenant
          work=$(mktemp -d)

          # init -> validate: the starter contract must lint clean.
          (cd "$work" && "$OLDPWD/$B" init covenant.yaml && "$OLDPWD/$B" validate covenant.yaml)

          # The bundled demo contract lints clean and passes its clean data.
          "$B" validate examples/contracts/orders.yaml
          "$B" check examples/data/orders.ndjson -c examples/contracts/orders.yaml

          # ...and fails the dirty data with exit 1, not 0 and not 2.
          set +e
          "$B" check examples/data/orders_bad.ndjson -c examples/contracts/orders.yaml
          code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::expected exit 1 on violating data, got $code"; exit 1; }

          # diff blocks the breaking revision.
          set +e
          "$B" diff examples/contracts/orders.yaml examples/contracts/orders_v2.yaml --fail-on breaking
          code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::expected exit 1 on a breaking diff, got $code"; exit 1; }

          # infer round-trips: the draft lints, and accepts the data it came from.
          "$B" infer examples/data/orders.ndjson --out "$work/drafted.yaml"
          "$B" validate "$work/drafted.yaml"
          "$B" check examples/data/orders.ndjson -c "$work/drafted.yaml"

          echo "Quickstart OK."
