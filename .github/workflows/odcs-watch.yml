# ODCS watch — runs on the PUBLIC mirror (lucheeseng827/covenant).
#
# Synced from the source repo as .github/workflows/odcs-watch.yml. Edit it at
# ops/odcs-watch.yml in the source tree, not here on the mirror: the next sync
# overwrites the mirror copy.
#
# Covenant reads the ODCS revisions it has been reviewed against (VERSIONS in
# src/odcs.rs) and refuses the others by apiVersion. This job keeps that list
# from falling behind the standard: each week it finds the revisions the
# standard has published, opens an issue to review each one Covenant does not
# read yet, and fails once one has gone 60 days without support. It also runs
# the reader over the standard's published examples. The logic, and how to run
# it locally, is in .github/scripts/odcs_watch.py.

name: ODCS watch

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: odcs-watch
  cancel-in-progress: false

jobs:
  watch:
    name: new ODCS revisions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The standard, with its full history: a revision is dated by the
      # commit that published its JSON schema.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bitol-io/open-data-contract-standard
          path: .odcs-standard
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: build
        run: cargo build --locked

      - name: watch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 .github/scripts/odcs_watch.py
          --covenant target/debug/covenant
          --standard .odcs-standard
          --open-issues
