version: 1.0.0
apiVersion: v3.2.0
kind: DataContract
id: 6a2f8c1d-3b4e-4f9a-8c7d-0e1f2a3b4c5d
status: active
customProperties:
  - id: prop_gov_object
    property: propGovObject
    vendor: example-vendor
    value:
      myObject:
        mox: abc
        moy: 123
