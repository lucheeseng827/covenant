# The Python face of the engine: the `covenant-data` wheel, imported as
# `covenant_data`. A standalone workspace with its own lock: it links pyo3,
# which the engine itself never does.
[workspace]

[package]
name = "covenant-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = true
description = "Python bindings for the Covenant engine (pyo3 + maturin, abi3), published to PyPI as covenant-data."

[lib]
name = "covenant_data"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Links pyo3 in extension-module mode, so the wheel does not link libpython.
# Off by default: a bare `cargo build` or `cargo test` needs no Python.
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
covenant = { package = "covenant-data", path = "..", default-features = false, features = ["arrow"] }
arrow-array = { version = "58", features = ["ffi"] }
arrow-schema = { version = "58", features = ["ffi"] }
clap = "4"                                            # parses argv as the binary does, for the console script
serde = "1"
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py39"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
