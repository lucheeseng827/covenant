vector: 1
id: quality/missing-values-zero
standard: ODCS v3.1.0
cites: "data-quality.md: missingValues"
description: "missingValues [null, ''] with mustBe: 0 fails nulls and empty strings, but not a space."
contract: |
  apiVersion: v3.1.0
  kind: DataContract
  id: vector
  version: 1.0.0
  schema:
    - name: t
      properties:
        - name: v
          logicalType: string
          quality:
            - metric: missingValues
              arguments:
                missingValues: [null, ""]
              mustBe: 0
records:
  - { v: "a" }
  - { v: "" }
  - { v: null }
  - { v: " " }
expect:
  verdict: fail
  failing: [1, 2]
