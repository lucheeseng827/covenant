vector: 1
id: properties/enum-values
standard: ODCS v3.1.0
cites: "schema.md: enum"
description: "enum lists the allowed values; matching is exact, so usd is not USD."
contract: |
  apiVersion: v3.1.0
  kind: DataContract
  id: vector
  version: 1.0.0
  schema:
    - name: t
      properties:
        - name: v
          logicalType: string
          enum:
            - value: USD
            - value: EUR
records:
  - { v: "USD" }
  - { v: "EUR" }
  - { v: "GBP" }
  - { v: "usd" }
  - { v: null }
expect:
  verdict: fail
  failing: [2, 3]
